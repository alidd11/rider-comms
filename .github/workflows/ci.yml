name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rider_comms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rider_comms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rider_comms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build:web
      - name: Install visual-test browser
        run: npx playwright install --with-deps chromium webkit
      - name: Run PWA visual smoke audit
        run: npm run test:pwa:visual
      - name: Verify Android bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/rider-comms-android
      - name: Upload PWA visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-visual-audit
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: warn
