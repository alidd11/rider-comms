name: CI

on:
  # Feature branches are verified by their PR. Running the same workflow on
  # both the branch push and the pull_request event produced duplicate checks
  # for every commit. Re-run on main after merge as the deployment baseline.
  push:
    branches:
      - main
  pull_request:
  # Weekly on main as well, so a broken upstream package, runner image or
  # expired test fixture shows up even in a week with no merges.
  schedule:
    - cron: '41 4 * * 1'
  # Started by update-pr-branches.yml after it merges main into a PR branch.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless: cancel it.
# Runs on main are never cancelled, so every merge keeps its baseline.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The work is split into parallel jobs (it used to be one ~20 minute job,
  # 14 minutes of it Playwright). `verify` at the end keeps the check name
  # that PRs and branch settings already know, and fails if any job did.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rider_comms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rider_comms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rider_comms_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Capture the exact advisory graph before enforcing a policy. This stays
      # non-blocking until the current findings are triaged so CI does not
      # encourage blind --force upgrades that could break Expo/native support.
      - name: Capture dependency audit reports
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Upload dependency audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-reports
          path: |
            npm-audit-all.json
            npm-audit-production.json
          if-no-files-found: error
      # The mobile/Expo graph currently has upstream advisories without a
      # compatible fix. Keep the server's production dependency policy strict:
      # a new backend runtime vulnerability must not be hidden by the larger
      # native tooling graph.
      - name: Enforce backend production dependency audit
        run: npm audit --omit=dev --workspace=@rider-comms/backend
      - run: npm run lint
      - run: npm run typecheck
      # Same suites as `npm test`, run once with coverage instrumentation.
      - run: npm run test:coverage
      # Back up the test database with the production backup scripts, restore
      # it, and compare row counts, so the backup tooling is proven on every
      # change rather than first exercised during an incident.
      - name: Backup and restore drill
        run: |
          # The Ubuntu apt mirror has been unreachable from runners at times;
          # fall back to the Go module proxy (checksum-verified via sum.golang.org).
          if ! (sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q -o Acquire::Retries=3 age); then
            echo "apt unavailable; installing age from the Go module proxy"
            GOBIN=$HOME/go-tools go install filippo.io/age/cmd/...@v1.2.1
            echo $HOME/go-tools >> "$GITHUB_PATH"
            export PATH="$HOME/go-tools:$PATH"
          fi
          age --version
          scripts/backup-drill.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  native-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Verify native Expo config
        working-directory: mobile
        run: npx expo prebuild --clean --no-install
      - name: Verify Android bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/rider-comms-android
      - name: Verify iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/rider-comms-ios
      - name: Report native export size
        run: node scripts/report-native-export-sizes.mjs android=/tmp/rider-comms-android ios=/tmp/rider-comms-ios
      - name: Upload native export size report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-export-size-report
          path: native-export-size-report.json
          if-no-files-found: error

  visual:
    # Pinned rather than ubuntu-latest: Playwright's WebKit system deps are
    # tied to the OS release, and ubuntu-latest moves to 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    # 30 leaves room for one run that has to fill the apt package cache from
    # a slow mirror (125 MB took 20 minutes on 18 November).
    timeout-minutes: 30
    strategy:
      # Every shard reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browsers' system packages (about 125 MB) are cached between runs:
      # the Ubuntu mirror has been slow enough to time the job out downloading
      # them. apt keeps what it downloads in ~/apt-archives (see below).
      - name: Restore browser system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: playwright-apt-${{ runner.os }}-24.04-${{ steps.playwright.outputs.version }}
      - name: Install visual-test browser
        # Browsers come from Playwright's CDN; their system libraries come from
        # the Ubuntu mirror, which is unreachable from runners at times. Retry
        # that part, then make sure both browsers really start: when WebKit's
        # libraries are missing (libevent, for one) every WebKit test fails at
        # launch, so stop here with the reason instead of 15 minutes later.
        run: |
          npx playwright install chromium webkit
          # Keep apt's downloads where the cache step can find them, and give
          # up on a stalled mirror connection instead of waiting on it.
          mkdir -p "$HOME/apt-archives/partial"
          printf '%s\n' "Dir::Cache::Archives \"$HOME/apt-archives\";" 'Binary::apt::APT::Keep-Downloaded-Packages "true";' 'APT::Keep-Downloaded-Packages "true";' 'Acquire::http::Timeout "60";' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99rider-comms-ci >/dev/null
          # Do not put timeout *outside* sudo: it can kill the parent
          # while leaving an apt-get child holding dpkg's lock. This caused
          # repeated WebKit failures (missing libevent-2.1.so.7) on PR CI.
          # Browser libraries come from Ubuntu's mirrors. The runner image
          # also lists Microsoft's package repository, which nothing here
          # uses; when it refuses (403 on 27 Nov 2026) apt update fails and
          # not one test runs. Drop it first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod*
          deps_ready=false
          for attempt in 1 2; do
            if sudo -E env "PATH=$PATH" npx playwright install-deps chromium webkit; then
              deps_ready=true
              break
            fi
            echo "::warning::Playwright dependency installation attempt $attempt failed"
            sleep 15
          done
          if [ "$deps_ready" != true ]; then
            echo "::error::Playwright system dependencies could not be installed"
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          node -e "const pw = require('@playwright/test'); (async () => { for (const type of [pw.chromium, pw.webkit]) await (await type.launch()).close(); })().catch((error) => { console.error('::error::A test browser cannot start (missing system libraries?): ' + (error.message.split('\\n').find((line) => line.includes('error while loading')) || error.message.split('\\n')[0])); process.exit(1); });"
      - name: Save browser system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Run PWA visual smoke audit (shard ${{ matrix.shard }} of 4)
        run: npm run test:pwa:visual -- --shard=${{ matrix.shard }}/4
      - name: Advisory Rider Comms Maps live-tile screenshot audit
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 572 && matrix.shard == 1
        continue-on-error: true
        timeout-minutes: 4
        env:
          RIDER_MAPS_LIVE_TILE_QA: '1'
        run: |
          # Research-only external tiles. Even a green CI badge does not prove
          # all map styles work on an installed iPhone; inspect attachments.
          set +e
          npx playwright test tests/visual/map-beta-live.spec.js --project=phone-modern --output=test-results/maps-beta-live --reporter=line --workers=1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "REAL_MAP_TILES=passed (inspect screenshots)" > test-results/maps-beta-live-result.txt
          else
            echo "REAL_MAP_TILES=failed_or_unavailable (research only)" > test-results/maps-beta-live-result.txt
            echo "::warning::Optional Maps tiles audit unavailable; normal CI stays strict."
          fi
          exit "$result"
      - name: Upload PWA visual audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-visual-audit-${{ matrix.shard }}
          path: |
            test-results/playwright
            test-results/maps-beta-live
            test-results/maps-beta-live-result.txt
            playwright-report
          if-no-files-found: warn

  # Expensive, unreleased experiment only on the owner's Maps draft.
  maps-london-graph:
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 572 && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/rider-maps-foundation-20261121')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build and route on real Greater London OSM data (research only)
        run: bash scripts/ci-london-map-graph.sh
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-london-graph-evidence
          path: test-results/maps-london-graph/*.json
          if-no-files-found: warn
          retention-days: 3

  verify:
    needs: [checks, native-bundles, visual]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job did not pass ($result)"
              exit 1
            fi
          done
