name: CI

on:
  # Feature branches are verified by their PR. Running the same workflow on
  # both the branch push and the pull_request event produced duplicate checks
  # for every commit. Re-run on main after merge as the deployment baseline.
  push:
    branches:
      - main
  pull_request:
  # Weekly on main as well, so a broken upstream package, runner image or
  # expired test fixture shows up even in a week with no merges.
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  verify:
    # Pinned rather than ubuntu-latest: Playwright's WebKit system deps are
    # tied to the OS release, and ubuntu-latest moves to 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    # A full run takes ~12 minutes; 25 leaves room for a slow browser or apt
    # mirror without letting a hung job run for the GitHub default of 6 hours.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rider_comms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rider_comms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rider_comms_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Capture the exact advisory graph before enforcing a policy. This stays
      # non-blocking until the current findings are triaged so CI does not
      # encourage blind --force upgrades that could break Expo/native support.
      - name: Capture dependency audit reports
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Upload dependency audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-reports
          path: |
            npm-audit-all.json
            npm-audit-production.json
          if-no-files-found: error
      # The mobile/Expo graph currently has upstream advisories without a
      # compatible fix. Keep the server's production dependency policy strict:
      # a new backend runtime vulnerability must not be hidden by the larger
      # native tooling graph.
      - name: Enforce backend production dependency audit
        run: npm audit --omit=dev --workspace=@rider-comms/backend
      - run: npm run lint
      - run: npm run typecheck
      # Same suites as `npm test`, run once with coverage instrumentation.
      - run: npm run test:coverage
      # Back up the test database with the production backup scripts, restore
      # it, and compare row counts, so the backup tooling is proven on every
      # change rather than first exercised during an incident.
      - name: Backup and restore drill
        run: |
          # The Ubuntu apt mirror has been unreachable from runners at times;
          # fall back to the Go module proxy (checksum-verified via sum.golang.org).
          if ! (sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q -o Acquire::Retries=3 age); then
            echo "apt unavailable; installing age from the Go module proxy"
            GOBIN=$HOME/go-tools go install filippo.io/age/cmd/...@v1.2.1
            echo $HOME/go-tools >> "$GITHUB_PATH"
            export PATH="$HOME/go-tools:$PATH"
          fi
          age --version
          scripts/backup-drill.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
      - name: Verify native Expo config
        working-directory: mobile
        run: npx expo prebuild --clean --no-install
      - run: npm run build:web
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install visual-test browser
        # Browsers come from Playwright's CDN; their system libraries come from
        # the Ubuntu mirror, which has been unreachable from runners at times.
        # Bound that part so an outage can't eat the whole job, then carry on:
        # the runner image already has most of what the browsers need.
        run: |
          npx playwright install chromium webkit
          timeout 480 sudo -E env "PATH=$PATH" npx playwright install-deps chromium webkit \
            || echo "::warning::Playwright system dependencies could not be installed (apt mirror unavailable?)"
      - name: Run PWA visual smoke audit
        run: npm run test:pwa:visual
      - name: Verify Android bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir /tmp/rider-comms-android
      - name: Verify iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir /tmp/rider-comms-ios
      - name: Report native export size
        run: node scripts/report-native-export-sizes.mjs android=/tmp/rider-comms-android ios=/tmp/rider-comms-ios
      - name: Upload native export size report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-export-size-report
          path: native-export-size-report.json
          if-no-files-found: error
      - name: Upload PWA visual audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwa-visual-audit
          path: |
            test-results/playwright
            playwright-report
          if-no-files-found: warn
