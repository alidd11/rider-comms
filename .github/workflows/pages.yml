name: Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build:web
      - name: Add runtime map configuration
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node -e "const fs=require('node:fs');fs.writeFileSync('dist/pwa/config.js','window.RIDER_COMMS_CONFIG = '+JSON.stringify({googleMapsApiKey:process.env.GOOGLE_MAPS_API_KEY||''})+';\\n')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa
      - id: deployment
        uses: actions/deploy-pages@v4
