name: Social app checks

on:
  pull_request:
    paths:
      - 'social/**'
      - '.github/workflows/social-app.yml'
  push:
    branches: [main]
    paths:
      - 'social/**'
      - '.github/workflows/social-app.yml'

permissions:
  contents: read

concurrency:
  group: social-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Social app TypeScript / tests / web export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Bootstrap the independent Social lockfile; switch to npm ci after capturing it.
      - run: npm install --no-audit --no-fund
      - name: Upload generated independent dependency lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-dependency-lock-${{ github.run_id }}
          path: social/mobile/package-lock.json
          if-no-files-found: error
      # One-time lockfile transfer for committing the isolated dependency graph.
      # Only package metadata/integrity hashes are emitted, never user credentials.
      - name: Emit lockfile metadata for repository commit
        if: github.head_ref == 'feat/social-app-foundation-20261112'
        run: |
          node --input-type=commonjs - <<'NODE'
          const content = require('node:fs').readFileSync('package-lock.json', 'utf8');
          for (let n = 0; n < content.length; n += 1200) {
            process.stdout.write('SOCIAL_LOCK_PART:' + String(n / 1200).padStart(4, '0') + ':' +
              JSON.stringify(content.slice(n, n + 1200)) + '\n');
          }
          NODE
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: test -f dist/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload social app UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social-ui-${{ github.run_id }}
          path: social/mobile/test-results/
          if-no-files-found: ignore
