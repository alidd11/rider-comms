name: Native builds

# Compiles and launches the native apps: iOS in a simulator (CocoaPods,
# native modules, Swift/Objective-C) and Android in an emulator (Gradle).
# The main CI job only checks the JavaScript bundle and the Expo config, so a
# native dependency that fails to compile or crashes at startup would
# otherwise first show up in an EAS build. Runs when the mobile app or its
# dependencies change, weekly, and on demand. Neither build needs signing.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'package-lock.json'
      - '.github/workflows/native-builds.yml'
      - 'scripts/android-launch-check.sh'
      - 'scripts/check-android-release.sh'
      - 'scripts/check-ios-purpose-strings.sh'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Expo SDK 57's expo-modules-jsi puts SWIFT_RETURNS_RETAINED on C++
      # constructors, which every Xcode up to 26.3 rejects (macos-15 tops out
      # there), so this uses the newest Xcode on the macos-26 image.
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ') (installed: $(ls /Applications | grep -E '^Xcode' | tr '\n' ' '))"
      - name: Generate the native project
        working-directory: mobile
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install
      - name: Build for the iOS simulator
        working-directory: mobile/ios
        # Release, so the JavaScript bundle is embedded and the app can start
        # without a Metro server. The full log is long; on failure the
        # compiler's own error lines are also published as an annotation.
        env:
          EXPO_PUBLIC_API_URL: https://backend-production-7fa0.up.railway.app
        run: |
          if ! xcodebuild \
            -workspace RiderComms.xcworkspace \
            -scheme RiderComms \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1; then
            tail -n 150 build.log
            errors="$(grep -E 'error:|fatal error|BUILD FAILED|The following build commands failed' build.log | sort -u | head -n 40)"
            echo "::error title=iOS build failed::${errors//$'\n'/%0A}"
            exit 1
          fi
          tail -n 20 build.log
      # App Store Connect rejects uploads that link a privacy-sensitive
      # framework without its purpose string; catch a new SDK doing that here.
      - name: Check purpose strings for linked frameworks
        working-directory: mobile/ios
        run: ../../scripts/check-ios-purpose-strings.sh build/Build/Products/Release-iphonesimulator/RiderComms.app
      # Compiling isn't enough: native modules (LiveKit's WebRTC globals in
      # particular) run at startup and can crash the app before any screen
      # appears. Boot a simulator, launch, and check it is still running.
      - name: Launch in the iOS simulator
        working-directory: mobile/ios
        run: |
          app="build/Build/Products/Release-iphonesimulator/RiderComms.app"
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.ridercomms.app
          sleep 30
          xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/ios-launch.png"
          if ! xcrun simctl spawn "$udid" launchctl list | grep -q 'com.ridercomms.app'; then
            report="$(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i -m1 rider || true)"
            detail="$( [ -n "$report" ] && head -n 40 ~/Library/Logs/DiagnosticReports/"$report" || echo 'no crash report found')"
            echo "::error title=iOS app crashed on launch::${detail//$'\n'/%0A}"
            exit 1
          fi
          echo "::notice title=iOS launch::Rider Comms is running 30 s after launch on $(xcrun simctl list devices | grep "$udid" | sed 's/ (.*//' | xargs)"
      - name: Create disposable native UI test account
        id: test-account
        env:
          API_URL: https://backend-production-7fa0.up.railway.app
        run: |
          username="ci${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}i"
          # Random per run: the run ID is public, so a password built from it
          # would let anyone watching Actions sign in to the account.
          password="RiderComms-$(openssl rand -hex 12)-Test!"
          payload="$(node -e 'console.log(JSON.stringify({username:process.argv[1],email:process.argv[1]+"@example.com",password:process.argv[2],deviceName:"GitHub iOS UI smoke",acceptTerms:true}))' "$username" "$password")"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --max-time 30 -X POST "$API_URL/auth/signup" -H 'content-type: application/json' -d "$payload")"
          token="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s); if (!x.token) process.exit(1); process.stdout.write(x.token);})')"
          # Deleted by the cleanup step at the end of the job, after the UI test has used it.
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          {
            echo "username=$username"
            echo "password=$password"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"
      - name: Install Maestro and exercise authenticated iOS screens
        env:
          # Hosted simulators can take minutes to start Maestro's driver.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          TEST_USERNAME: ${{ steps.test-account.outputs.username }}
          TEST_PASSWORD: ${{ steps.test-account.outputs.password }}
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          set +e
          # Maestro fills ${…} in a flow from -e values, not the shell environment.
          maestro test -e TEST_USERNAME="$TEST_USERNAME" -e TEST_PASSWORD="$TEST_PASSWORD" mobile/maestro/authenticated-smoke.yaml --format junit --output maestro-ios.xml
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            # What was on screen when the flow failed, readable in the job log.
            echo "::group::Screen at failure"
            maestro hierarchy 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const texts=new Set();const walk=(n)=>{if(!n||typeof n!=="object")return;const a=n.attributes||{};for(const k of ["text","accessibilityText","hintText","resource-id"])if(a[k])texts.add(k+": "+a[k]);(n.children||[]).forEach(walk);};try{walk(JSON.parse(s));}catch{console.log(s.slice(0,4000));}console.log([...texts].join("\n"));})' || true
            echo "::endgroup::"
          fi
          set -e
          mkdir -p maestro-ios-artifacts
          find "$HOME/.maestro" -type f -name '*.png' -exec cp {} maestro-ios-artifacts/ \; 2>/dev/null || true
          exit "$test_status"
      - name: Delete the disposable test account
        if: always() && steps.test-account.outputs.token != ''
        env:
          API_URL: https://backend-production-7fa0.up.railway.app
          TEST_TOKEN: ${{ steps.test-account.outputs.token }}
        run: |
          curl --silent --show-error --max-time 15 -X DELETE "$API_URL/auth/me" \
            -H "authorization: Bearer $TEST_TOKEN" -o /dev/null -w 'Account deletion: HTTP %{http_code}\n' || true
      - name: Upload authenticated iOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-authenticated-ux
          path: |
            maestro-ios-artifacts
            maestro-ios.xml
          if-no-files-found: ignore
      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-launch-screenshot
          path: ios-launch.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-24.04
    # The release build takes about half an hour; the emulator step has its
    # own 25-minute limit.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native project
        working-directory: mobile
        env:
          # Google Maps on Android aborts the app when no key is configured.
          # CI has no real key; a placeholder lets the map screen open (its
          # tiles stay blank) so the UI smoke test can run. Production builds
          # refuse to build without the real key (app.config.js).
          GOOGLE_MAPS_ANDROID_API_KEY: ci-placeholder-no-map-tiles
        run: npx expo prebuild --clean --platform android --no-install
      - name: Build a release APK
        working-directory: mobile/android
        # Release embeds the JavaScript bundle (no Metro needed); the Expo
        # template signs it with the debug keystore, which is fine for CI.
        env:
          EXPO_PUBLIC_API_URL: https://backend-production-7fa0.up.railway.app
        run: |
          if ! ./gradlew assembleRelease --no-daemon > build.log 2>&1; then
            tail -n 150 build.log
            errors="$( (sed -n '/What went wrong/,/Try:/p' build.log; grep -E '^e: |error:' build.log) | head -n 40)"
            echo "::error title=Android build failed::${errors//$'\n'/%0A}"
            exit 1
          fi
          tail -n 20 build.log
      # Play's 16 KB page-size rule, target API level, and the manifest's
      # permissions against the store answers.
      - name: Check the APK against Play requirements
        run: scripts/check-android-release.sh mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same reason as the iOS launch check: native modules run at startup.
      # Uses the runner's own Android SDK rather than a third-party action.
      - name: Launch in an Android emulator
        timeout-minutes: 25
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          image="system-images;android-34;google_apis;x86_64"
          fail() {
            log="$(tail -n 30 emulator.log 2>/dev/null)"
            echo "::error title=Android emulator: $1::${log//$'\n'/%0A}"
            exit 1
          }
          yes | sdkmanager --licenses > /dev/null || true
          timeout 600 sdkmanager --install "$image" emulator platform-tools > /dev/null || fail "SDK install timed out"
          # avdmanager and the emulator default to different AVD folders on
          # this image, so both are pointed at one explicitly.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name ci --package "$image" --force
          emulator -list-avds | grep -qx ci || fail "AVD was not created"
          ls -l /dev/kvm
          emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -accel on -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 300 adb wait-for-device || fail "device never appeared"
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 5; done' || fail "did not finish booting"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          scripts/android-launch-check.sh
      - name: Create disposable native UI test account
        id: test-account
        env:
          API_URL: https://backend-production-7fa0.up.railway.app
        run: |
          username="ci${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}a"
          # Random per run: the run ID is public, so a password built from it
          # would let anyone watching Actions sign in to the account.
          password="RiderComms-$(openssl rand -hex 12)-Test!"
          payload="$(node -e 'console.log(JSON.stringify({username:process.argv[1],email:process.argv[1]+"@example.com",password:process.argv[2],deviceName:"GitHub Android UI smoke",acceptTerms:true}))' "$username" "$password")"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --max-time 30 -X POST "$API_URL/auth/signup" -H 'content-type: application/json' -d "$payload")"
          token="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s); if (!x.token) process.exit(1); process.stdout.write(x.token);})')"
          # Deleted by the cleanup step at the end of the job, after the UI test has used it.
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          {
            echo "username=$username"
            echo "password=$password"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"
      - name: Install Maestro and exercise authenticated Android screens
        env:
          # Hosted simulators can take minutes to start Maestro's driver.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          TEST_USERNAME: ${{ steps.test-account.outputs.username }}
          TEST_PASSWORD: ${{ steps.test-account.outputs.password }}
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          set +e
          # Maestro fills ${…} in a flow from -e values, not the shell environment.
          maestro test -e TEST_USERNAME="$TEST_USERNAME" -e TEST_PASSWORD="$TEST_PASSWORD" mobile/maestro/authenticated-smoke.yaml --format junit --output maestro-android.xml
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            # What was on screen when the flow failed, readable in the job log.
            echo "::group::Screen at failure"
            maestro hierarchy 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const texts=new Set();const walk=(n)=>{if(!n||typeof n!=="object")return;const a=n.attributes||{};for(const k of ["text","accessibilityText","hintText","resource-id"])if(a[k])texts.add(k+": "+a[k]);(n.children||[]).forEach(walk);};try{walk(JSON.parse(s));}catch{console.log(s.slice(0,4000));}console.log([...texts].join("\n"));})' || true
            echo "::endgroup::"
          fi
          set -e
          mkdir -p maestro-android-artifacts
          find "$HOME/.maestro" -type f -name '*.png' -exec cp {} maestro-android-artifacts/ \; 2>/dev/null || true
          exit "$test_status"
      - name: Delete the disposable test account
        if: always() && steps.test-account.outputs.token != ''
        env:
          API_URL: https://backend-production-7fa0.up.railway.app
          TEST_TOKEN: ${{ steps.test-account.outputs.token }}
        run: |
          curl --silent --show-error --max-time 15 -X DELETE "$API_URL/auth/me" \
            -H "authorization: Bearer $TEST_TOKEN" -o /dev/null -w 'Account deletion: HTTP %{http_code}\n' || true
      - name: Upload authenticated Android screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-authenticated-ux
          path: |
            maestro-android-artifacts
            maestro-android.xml
          if-no-files-found: ignore
      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-launch-screenshot
          path: android-launch.png
          if-no-files-found: ignore
