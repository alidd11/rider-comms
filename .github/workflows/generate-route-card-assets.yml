name: Generate route card assets

on:
  push:
    branches:
      - perf/local-route-thumbnails
    paths:
      - scripts/fetch-route-card-images.mjs
      - .github/workflows/generate-route-card-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/local-route-thumbnails
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Ensure image optimizer is available
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          convert -version
      - name: Fetch approved route card images
        run: node scripts/fetch-route-card-images.mjs
      - name: Commit generated route assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROUTE_CARD_ASSETS.json docs/assets/routes/cards mobile/assets/routes/cards
          if git diff --cached --quiet; then
            echo "Route card assets already current"
            exit 0
          fi
          git commit -m "Bundle approved route card images"
          git push origin HEAD:perf/local-route-thumbnails
