name: Database backup

# Nightly encrypted logical backup of the production database, restored into a
# throwaway Postgres first to prove it is usable. Needs repository secrets
# PRODUCTION_DATABASE_URL (an externally reachable URL, with sslmode=require)
# and BACKUP_AGE_RECIPIENT (an age public key). The matching private key must
# NOT be stored in GitHub. Until both secrets exist the job FAILS, so a
# missing backup is never hidden behind a green tick. See BACKUP_RESTORE.md.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Must match (or exceed) the production server's major version, since
      # pg_dump refuses to dump a newer server. Override with a repository
      # variable if production moves to a newer Postgres.
      POSTGRES_MAJOR: ${{ vars.POSTGRES_MAJOR || '16' }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    services:
      verify:
        image: postgres:${{ vars.POSTGRES_MAJOR || '16' }}-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify -d verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ] || [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::error::No backup taken: set the PRODUCTION_DATABASE_URL and BACKUP_AGE_RECIPIENT repository secrets (see BACKUP_RESTORE.md)."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Postgres client and age
        if: steps.config.outputs.enabled == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q "postgresql-client-${POSTGRES_MAJOR}"
          echo "/usr/lib/postgresql/${POSTGRES_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Back up, verify and encrypt
        if: steps.config.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_VERIFY_DATABASE_URL: postgres://verify:verify@127.0.0.1:5432/verify
        run: scripts/db-backup.sh "$RUNNER_TEMP/backup"
      - name: Upload encrypted backup
        if: steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rider-comms-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/
          if-no-files-found: error
          retention-days: 30
