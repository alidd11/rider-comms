# Temporary: adds expo-notifications (the version matching this Expo SDK) to
# mobile/package.json and package-lock.json on the push-notifications branch,
# because the editing environment can't reach the npm registry. Removed in
# the next commit on that branch.
name: Add expo-notifications to the lockfile
on:
  push:
    branches: [push-notifications]
    paths: ['.github/workflows/lockfile-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: push-notifications
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - working-directory: mobile
        run: npx expo install expo-notifications
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json mobile/package.json
          git commit -m "Add expo-notifications for the installed Expo SDK"
          git push origin HEAD:push-notifications
