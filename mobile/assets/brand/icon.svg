<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!-- Full-bleed, opaque: iOS applies its own corner mask. Same mark as
       docs/icons and the Android adaptive foreground: a headset with a boom
       mic, and a voice waveform between the earcups. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#122633"/>
      <stop offset="1" stop-color="#080D10"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="mark">
    <g fill="none" stroke="#2FA8D3" stroke-linecap="round">
      <path d="M118 238 A138 138 0 0 1 394 238" stroke-width="36"/>
      <path d="M128 350 C138 404 186 420 232 420" stroke-width="22"/>
      <path d="M226 252 V300 M256 228 V324 M286 252 V300" stroke-width="22"/>
    </g>
    <g fill="#2FA8D3">
      <rect x="84" y="212" width="86" height="146" rx="38"/>
      <rect x="342" y="212" width="86" height="146" rx="38"/>
      <rect x="226" y="400" width="54" height="40" rx="20"/>
    </g>
  </g>
</svg>
