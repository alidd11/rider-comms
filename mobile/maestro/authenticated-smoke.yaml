appId: com.ridercomms.app

---
- launchApp:
    clearState: true
- takeScreenshot: before-login
- tapOn:
    id: auth-username
- inputText: ${TEST_USERNAME}
- tapOn:
    id: auth-password
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- takeScreenshot: before-submit
- tapOn:
    id: auth-submit
- waitForAnimationToEnd
- takeScreenshot: after-login
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 30000
- tapOn: Get Started
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: Continue
- waitForAnimationToEnd
- takeScreenshot: after-location-continue
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- takeScreenshot: authenticated-map
- tapOn: "Ride"
- takeScreenshot: authenticated-ride
- tapOn: "Friends"
- takeScreenshot: authenticated-friends
- tapOn: "Settings"
- takeScreenshot: authenticated-settings
- tapOn: "Account"
- tapOn: "Your plan"
- extendedWaitUntil:
    visible: "Your plan"
    timeout: 10000
- takeScreenshot: authenticated-billing
