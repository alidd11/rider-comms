appId: com.ridercomms.app
---
# Signs in with the disposable account CI creates, then opens each main tab
# and the plan screen. Screenshots are uploaded as workflow artifacts.
- launchApp:
    clearState: true
    permissions:
      all: allow
- takeScreenshot: before-login
# On the iOS simulator the first keystroke can bring up the AutoFill bar,
# and Maestro's typing has then sometimes landed only the first character
# ("c" instead of the whole username). Type into each field by test ID,
# wait for the keyboard first, and check the username actually arrived
# before moving on; retry the field if it didn't.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: auth-username
      - waitForAnimationToEnd
      - eraseText: 30
      - inputText: ${TEST_USERNAME}
      - assertVisible: ${TEST_USERNAME}
# The password is masked, so check it isn't a lone "•" (only the first
# keystroke landed) rather than checking the text itself.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: auth-password
      - waitForAnimationToEnd
      - eraseText: 40
      - inputText: ${TEST_PASSWORD}
      - waitForAnimationToEnd
      - assertNotVisible: "•"
- hideKeyboard:
    optional: true
- takeScreenshot: before-submit
# Hiding the keyboard on iOS can send the password field's Go key, which
# signs in on its own; tap Sign in only if the form is still showing.
- runFlow:
    when:
      visible:
        id: auth-submit
    commands:
      - tapOn:
          id: auth-submit
# First launch shows the two-step onboarding (welcome, then location).
# iOS adds to labels ("Get started, ", "Group Ride, tab, 2 of 5"), so each
# match allows a comma and more after the visible text. Sign-in can take a
# moment, so wait for the welcome step before deciding it isn't there, and
# retry each tap until the next step shows: the iOS simulator drops taps
# (see #461, #463), and a dropped "Get started" left the run on this screen.
- extendedWaitUntil:
    visible: "Get [Ss]tarted(,.*)?"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Get [Ss]tarted(,.*)?"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - tapOn:
                text: "Get [Ss]tarted(,.*)?"
                optional: true
            - extendedWaitUntil:
                visible: "Continue(,.*)?"
                timeout: 5000
- runFlow:
    when:
      visible: "Continue(,.*)?"
    commands:
      - retry:
          maxRetries: 3
          commands:
            - tapOn:
                text: "Continue(,.*)?"
                optional: true
            - extendedWaitUntil:
                notVisible: "Continue(,.*)?"
                timeout: 5000
# No tab bar: the map's Where to drawer holds search and Home, Work and
# Petrol; Ride, Friends, Routes and Settings are in the menu behind the
# rider's avatar, and each page has a back arrow to the map.
- extendedWaitUntil:
    visible:
      id: drawer-home
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: authenticated-map
# Petrol opens search on nearby petrol stations. The iOS simulator has
# dropped this first tap and left the map unchanged, so tap until the
# search page shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: drawer-petrol
          optional: true
      - extendedWaitUntil:
          visible: "Back to map"
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: authenticated-petrol
# Every tap below that leaves a screen is retried until the next screen
# shows: the iOS simulator drops taps (see #461, #463).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Back to map"
          optional: true
      - extendedWaitUntil:
          visible:
            id: drawer-home
          timeout: 8000
- waitForAnimationToEnd
# On the iOS simulator a first tap has left the screen unchanged, so open
# the menu and tap Ride again until the Ride page shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: open-menu
          optional: true
      - tapOn: "Ride(,.*)?"
      - extendedWaitUntil:
          visible:
            id: ride-back
          timeout: 8000
- takeScreenshot: authenticated-ride
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: ride-back
          optional: true
      - extendedWaitUntil:
          visible:
            id: open-menu
          timeout: 8000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: open-menu
          optional: true
      - tapOn: "Friends(,.*)?"
      - extendedWaitUntil:
          visible: "Back to map"
          timeout: 8000
- takeScreenshot: authenticated-friends
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Back to map"
          optional: true
      - extendedWaitUntil:
          visible:
            id: open-menu
          timeout: 8000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: open-menu
      - extendedWaitUntil:
          visible: "Settings(,.*)?"
          timeout: 8000
- takeScreenshot: authenticated-menu
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Settings(,.*)?"
          optional: true
      # The Settings root's first row; its back control is "Go back".
      - extendedWaitUntil:
          visible: "General(,.*)?"
          timeout: 8000
- takeScreenshot: authenticated-settings
# Settings lists categories: open one, then one of its pages.
- scrollUntilVisible:
    element: "Account and login"
    direction: DOWN
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Account and login"
          optional: true
      - extendedWaitUntil:
          visible: "Signed-in devices(,.*)?"
          timeout: 8000
- takeScreenshot: authenticated-account
- tapOn: "Signed-in devices(,.*)?"
- waitForAnimationToEnd
- takeScreenshot: authenticated-devices
# The X closes every Settings level at once; back again returns to the map.
# A tap that lands mid-transition can leave one level open (an iOS run
# stopped on Account and login), so go back until the map's menu shows.
- tapOn: "Close settings"
- waitForAnimationToEnd
- repeat:
    while:
      notVisible:
        id: open-menu
    times: 4
    commands:
      - tapOn: "Go back"
      - waitForAnimationToEnd
# The profile and the plan each have one home in the menu.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: open-menu
          optional: true
      - waitForAnimationToEnd
      - tapOn: "View profile"
      - extendedWaitUntil:
          visible: "Edit profile"
          timeout: 10000
- takeScreenshot: authenticated-profile
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          text: "Go back"
          optional: true
      - extendedWaitUntil:
          visible:
            id: open-menu
          timeout: 10000
# The menu slides in; a tap during that has been dropped on iOS. Wait for
# the plan screen's own intro line, as "Your plan" is also the menu row's
# label.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: open-menu
          optional: true
      - waitForAnimationToEnd
      - tapOn: "Your plan(,.*)?"
      - extendedWaitUntil:
          visible: "Plans change how far Nearby reaches.*"
          timeout: 10000
- takeScreenshot: authenticated-billing
