appId: com.ridercomms.app
---
# Signs in with the disposable account CI creates, then opens each main tab
# and the plan screen. Screenshots are uploaded as workflow artifacts.
- launchApp:
    clearState: true
    permissions:
      all: allow
- takeScreenshot: before-login
- tapOn: "Username"
- inputText: ${TEST_USERNAME}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- takeScreenshot: before-submit
- tapOn: "Log in"
# First launch shows the two-step onboarding (welcome, then location).
- tapOn:
    text: "Get Started"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: authenticated-map
- tapOn: "Ride"
- takeScreenshot: authenticated-ride
- tapOn: "Friends"
- takeScreenshot: authenticated-friends
- tapOn: "Settings"
- takeScreenshot: authenticated-settings
- tapOn: "Account"
- tapOn: "Your plan"
- extendedWaitUntil:
    visible: "Your plan"
    timeout: 10000
- takeScreenshot: authenticated-billing
