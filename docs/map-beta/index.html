<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07141b">
  <meta name="description" content="Experimental Rider Comms Maps basemap preview. Not part of the released application.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; connect-src https://tiles.openfreemap.org https://assets.openfreemap.com https://unpkg.com; font-src https://assets.openfreemap.com data:; img-src 'self' data: blob: https://tiles.openfreemap.org https://assets.openfreemap.com; worker-src blob:">
  <meta name="robots" content="noindex,nofollow">
  <title>Rider Comms Maps · admin beta</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.3.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./preview.css">
  <script defer src="./preview.bundle.js"></script>
</head>
<body>
  <main class="map-shell">
    <div id="map" role="region" aria-label="Experimental OpenStreetMap basemap centred on London"></div>
    <header class="toolbar">
      <div class="branding">
        <span class="brand-icon" aria-hidden="true">RC</span>
        <div><strong>Rider Comms Maps</strong><span>Basemap research preview</span></div>
      </div>
      <a class="return-classic" href="../index.html" aria-label="Return to Rider Comms classic map">Use classic map</a>
    </header>
    <section class="controls" aria-label="Map appearance">
      <div class="control-heading">Map appearance</div>
      <div class="segmented" role="group" aria-label="Map theme">
        <button type="button" id="dayStyle" aria-pressed="true">Day</button>
        <button type="button" id="nightStyle" aria-pressed="false">Night</button>
      </div>
      <button type="button" id="demoOverlay" class="reset" aria-pressed="false">Show illustrative route overlay</button>
      <button type="button" id="resetCamera" class="reset">Return to sample area</button>
      <p>The overlay is synthetic, not road-matched and never navigation advice. No real location, traffic, routing, search or hazard data is accessed.</p>
    </section>
    <div class="bottom-bar">
      <output id="status" role="status" aria-live="polite">Loading map…</output>
      <span>Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a> · Tiles by <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a></span>
    </div>
  </main>
</body>
</html>
