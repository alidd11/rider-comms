<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://backend-production-7fa0.up.railway.app; base-uri 'none'; form-action 'none'">
  <title>Rider Comms · Staff dashboard</title>
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11.5c2.5-5 5-7 12-7"/><path d="M2 11.5h5l3-4"/></svg></span>
        <span class="brand-name">Rider Comms</span>
        <span class="brand-tag">Staff</span>
        <div class="brand-actions">
          <button type="button" class="icon-button" id="refreshMobile" aria-label="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Dashboard sections" hidden>
        <button type="button" class="nav-item" data-view="overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Overview</button>
        <button type="button" class="nav-item" data-view="riders"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.3 2.4-3.5 4.5-3.5s3.9 1.2 4.5 3.5"/><path d="M10.5 3.2a2.5 2.5 0 0 1 0 4.6"/><path d="M12 10.3c1.2.5 2 1.6 2.5 3.2"/></svg>Riders</button>
        <button type="button" class="nav-item" data-view="moderation"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 13 3.6v4c0 3.1-2.1 5.4-5 6.6-2.9-1.2-5-3.5-5-6.6v-4z"/><path d="M8 5.5v3"/><path d="M8 10.8v.01"/></svg>Moderation<span class="nav-count" id="navReportCount" hidden></span></button>
        <button type="button" class="nav-item" data-view="system"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>System</button>
      </nav>
      <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>
    <div class="main">
      <main class="page" id="page" aria-live="polite"></main>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
