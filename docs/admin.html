<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://backend-production-7fa0.up.railway.app; base-uri 'none'; form-action 'none'">
  <title>Rider Comms dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="mod-header">
    <h1>Rider Comms dashboard</h1>
    <p id="modStatus" class="mod-status" role="status">Checking your sign-in…</p>
  </header>
  <nav class="mod-tabs" aria-label="Dashboard sections" hidden id="modTabs">
    <button type="button" data-view="overview" aria-pressed="true">Overview</button>
    <button type="button" data-view="riders" aria-pressed="false">Riders</button>
    <button type="button" data-view="moderation" aria-pressed="false">Moderation</button>
    <button type="button" data-view="system" aria-pressed="false">System</button>
    <button type="button" id="modRefresh" class="mod-refresh">Refresh</button>
  </nav>
  <main id="modList" class="mod-list" aria-live="polite"></main>
  <script src="admin.js"></script>
</body>
</html>
