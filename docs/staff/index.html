<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://backend-production-7fa0.up.railway.app; media-src https://backend-production-7fa0.up.railway.app; font-src 'self'; connect-src https://backend-production-7fa0.up.railway.app; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RC Staff">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Rider Comms Staff · secure team operations and moderation.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Rider Comms Staff · Operations Hub</title>
  <link rel="preload" href="../fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <button type="button" class="icon-button menu-toggle" id="menuToggle" aria-label="Open menu" aria-controls="sidebarPanel" aria-expanded="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
        <span class="brand-mark" aria-hidden="true"><svg viewBox="66 66 380 380" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M118 238 A138 138 0 0 1 394 238" stroke-width="36"/><path d="M128 350 C138 404 186 420 232 420" stroke-width="22"/><path d="M226 252 V300 M256 228 V324 M286 252 V300" stroke-width="22"/><g fill="currentColor" stroke="none"><rect x="84" y="212" width="86" height="146" rx="38"/><rect x="342" y="212" width="86" height="146" rx="38"/><rect x="226" y="400" width="54" height="40" rx="20"/></g></svg></span>
        <span class="brand-name">Rider Comms</span>
        <span class="brand-tag">Operations</span>
        <span class="brand-section" id="brandSection" aria-hidden="true"></span>
        <div class="brand-actions">
          <button type="button" class="icon-button header-search-button" id="globalSearchMobile" hidden aria-label="Search operations" aria-haspopup="dialog" aria-controls="globalSearchDialog"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
          <button type="button" class="icon-button" id="refreshMobile" aria-label="Refresh"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
        </div>
      </div>
      <div class="sidebar-panel" id="sidebarPanel">
      <div class="sidebar-search-slot" hidden>
        <button type="button" class="sidebar-search-button" id="globalSearchTrigger" aria-haspopup="dialog" aria-controls="globalSearchDialog" aria-label="Search operations">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><span>Search operations</span><kbd>/</kbd>
        </button>
      </div>
      <nav class="nav" id="nav" aria-label="Operations Hub sections" hidden>
        <div class="nav-group" data-nav-group>
          <div class="nav-group-label">Workspace</div>
          <button type="button" class="nav-item" data-view="overview" data-permission="view_overview"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Overview</button>
          <button type="button" class="nav-item" data-view="riders" data-permission="view_riders"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5c.6-2.3 2.4-3.5 4.5-3.5s3.9 1.2 4.5 3.5"/><path d="M10.5 3.2a2.5 2.5 0 0 1 0 4.6"/><path d="M12 10.3c1.2.5 2 1.6 2.5 3.2"/></svg>Riders</button>
        </div>
        <div class="nav-group" data-nav-group>
          <div class="nav-group-label">Trust & safety</div>
        <button type="button" class="nav-item" data-view="inbox" data-permission="moderate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9h3l1.5 2.5h3L11 9h3"/><path d="M3.5 3.5h9L14 9v4H2V9z"/></svg>Action inbox</button>
          <button type="button" class="nav-item" data-view="moderation" data-permission="moderate"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 13 3.6v4c0 3.1-2.1 5.4-5 6.6-2.9-1.2-5-3.5-5-6.6v-4z"/><path d="M8 5.5v3"/><path d="M8 10.8v.01"/></svg>Moderation<span class="nav-count" id="navReportCount" hidden></span></button>
          <button type="button" class="nav-item" data-view="audit" data-permission="view_audit"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M9.5 1.8V5h3"/><path d="M6 8h4.5M6 10.5h4.5"/></svg>Audit log</button>
        </div>
        <div class="nav-group" data-nav-group>
          <div class="nav-group-label">Administration</div>
          <button type="button" class="nav-item" data-view="staff" data-permission="manage_staff"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5" r="2.6"/><path d="M3 14c.7-2.6 2.6-4 5-4s4.3 1.4 5 4"/><path d="m11.2 1.8.6 1.2 1.3.2-1 .9.3 1.3-1.2-.7-1.2.7.3-1.3-1-.9 1.3-.2z"/></svg>Staff</button>
          <button type="button" class="nav-item" data-view="system" data-permission="view_system"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h3"/></svg>System</button>
        </div>
      </nav>
      <div class="sidebar-footer" id="sidebarFooter"></div>
      </div>
    </aside>
    <div class="menu-backdrop" id="menuBackdrop" hidden></div>
    <div class="main">
      <header class="workspace-toolbar" aria-label="Workspace navigation">
        <div class="workspace-crumbs" aria-label="Current location">
          <span class="workspace-crumb-root">Workspace</span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 3.5 4 4.5-4 4.5"/></svg>
          <span class="workspace-crumb-current" id="workspaceCurrentSection">Overview</span>
        </div>
        <button type="button" class="workspace-command" id="workspaceSearchTrigger" aria-haspopup="dialog" aria-controls="globalSearchDialog" aria-label="Open command search" hidden>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <span>Quick search</span>
          <kbd>Ctrl / ⌘ K</kbd>
        </button>
      </header>
      <main class="page" id="page" aria-live="polite"></main>
    </div>
  </div>
  <dialog class="dialog search-dialog" id="globalSearchDialog" aria-labelledby="globalSearchTitle">
    <h2 class="visually-hidden" id="globalSearchTitle">Search operations</h2>
    <div class="search-dialog-top">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input type="search" class="global-search-input" id="globalSearchInput" aria-label="Search pages and riders" placeholder="Search pages or find a rider" autocomplete="off" maxlength="100">
      <button type="button" class="search-close" id="globalSearchClose" aria-label="Close search">Esc</button>
    </div>
    <div class="search-dialog-content">
      <div class="search-results" id="globalSearchSections"></div>
      <div class="search-results" id="globalSearchRiders"></div>
      <p class="search-status" role="status" id="globalSearchStatus"></p>
    </div>
    <div class="search-dialog-footer">Search is limited to staff-authorised pages and rider accounts.</div>
  </dialog>
  <script src="../admin.js"></script>
</body>
</html>
